# Symlinked from /etc/nginx/sites-enabled/ on the VPS.
#
# Single source of truth, SSL included. Certificates come from
# `certbot certonly --nginx -d trisatya.dev`, never `certbot --nginx`
# (it would edit this checkout and the next deploy would drop the edit).
# Test locally with scripts/nginx-test.sh.

server {
    listen 80;
    listen [::]:80;
    server_name trisatya.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name trisatya.dev;

    ssl_certificate     /etc/letsencrypt/live/trisatya.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trisatya.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
