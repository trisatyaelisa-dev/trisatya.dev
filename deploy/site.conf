# Nginx inside the container. TLS and the public hostname are handled by the
# host's Nginx (nginx/trisatya.dev.conf), which proxies to 127.0.0.1:8081.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Live status written every minute by scripts/status.sh on the host.
    location /status/ {
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
